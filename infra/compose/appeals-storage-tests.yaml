name: matigr-appeals-storage-tests
services:
  database:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: appeals_storage_test
      POSTGRES_USER: appeals_storage_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs: [/var/lib/postgresql]
    networks: [storage-test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U appeals_storage_test -d appeals_storage_test']
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: matigr-appeals-storage-tests:v0
    build:
      context: ../..
      dockerfile: infra/compose/Appeals.StorageTests.Dockerfile
    environment:
      ConnectionStrings__AppealsStorageTest: Host=database;Database=appeals_storage_test;Username=appeals_storage_test;Password=isolated-test-only
    networks: [storage-test]
    depends_on:
      database: { condition: service_healthy }
networks:
  storage-test: { internal: true }
