name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-architecture.mjs
      - run: dotnet restore src/backend/Matigr.slnx --locked-mode
      - run: dotnet build src/backend/Matigr.slnx --no-restore -c Release
      - run: dotnet test src/backend/Matigr.slnx --no-build --no-restore -c Release
